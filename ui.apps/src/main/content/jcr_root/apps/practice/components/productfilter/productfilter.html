
<div class="product-filter" data-sly-use.model="com.adobe.aem.tutorial.core.models.ProductFilterModel">

    <h3>${model.title}</h3>

    <div class="filter-section">
        <h4>Categories</h4>
        <ul>
            <li><input type="checkbox" class="category-filter" value="electronics"/> Electronics</li>
            <li><input type="checkbox" class="category-filter" value="fashion"/> Fashion</li>
            <li><input type="checkbox" class="category-filter" value="home"/> Home</li>
            <li><input type="checkbox" class="category-filter" value="sports"/> Sports</li>
        </ul>
    </div>

    <div class="filter-section">
        <h4>Price Range</h4>
        <input type="range" id="priceRange" min="0" max="1000" step="50"/>
        <p>Max Price: <span id="priceValue">1000</span> ₹</p>
    </div>

    <button class="apply-filters">Apply Filters</button>
</div>

<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-call="${clientlib.css @ categories='practice.productfilter'}" />
<sly data-sly-call="${clientlib.js @ categories='practice.productfilter'}" />
