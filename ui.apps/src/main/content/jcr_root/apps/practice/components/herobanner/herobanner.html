<sly data-sly-use.hero="com.adobe.aem.tutorial.core.models.HeroBannerModel">
    <div class="hero-banner" style="background-image: url(${hero.backgroundImage @ context='uri'});">
        <div class="hero-overlay">
            <h1 class="hero-title">${hero.title}</h1>
            <p class="hero-subtitle">${hero.subtitle}</p>

    </div>
</sly>
