<sly data-sly-use.carousel="com.adobe.aem.tutorial.core.models.CarouselModel">
    <div class="carousel">
        <div class="slides">
            <sly data-sly-list.slide="${carousel.slides}">
                <div class="slide">
                    <a href="${slide.link}">
                        <img src="${slide.image}" alt="${slide.title}">
                        <div class="caption">${slide.title}</div>
                    </a>
                </div>
            </sly>
        </div>

        <div class="navigation">
            <span class="prev">&#10094;</span>
            <span class="next">&#10095;</span>
        </div>

        <div class="dots">
            <sly data-sly-list.dot="${carousel.slides}">
                <span class="dot"></span>
            </sly>
        </div>
    </div>
</sly>

<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-call="${clientlib.css @ categories='practice.carousel'}" />
<sly data-sly-call="${clientlib.js @ categories='practice.carousel'}" />
