<div class="shopping-cart" data-sly-use.cart="com.adobe.aem.tutorial.core.models.CartModel">
    <h3>${cart.title}</h3>

    <div class="cart-items">
        <sly data-sly-list.item="${cart.cartItems}">
            <div class="cart-item">
                <span class="item-name">${item.name}</span>
                <span class="item-price">₹${item.price}</span>
                <span class="item-qty">Qty: ${item.quantity}</span>
                <a href="?remove=${item.name}">
                    <button class="remove-item">Remove</button>
                </a>
            </div>
<!--            <div class="cart-item">-->
<!--                <span class="item-name">${item['name']}</span>-->
<!--                <span class="item-qty">Qty: ${item['quantity']}</span>-->
<!--                <span class="item-price">₹${item['price']}</span>-->
<!--                <span class="item-subtotal">Subtotal: ₹${item['subtotal']}</span>-->
<!--            </div>-->
        </sly>
    </div>

    <div class="cart-total">
        <strong>Total: ₹${cart.cartTotal}</strong>
    </div>

    <button class="checkout-btn" onclick="window.location.href='${cart.checkoutPage @ context='uri'}.html?wcmmode=disabled'">
        Proceed to Checkout
    </button>
</div>

<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-call="${clientlib.css @ categories='practice.cart'}" />
