<div class="shopping-cart" data-sly-use.cart="com.adobe.aem.tutorial.core.models.CartModel">
    <h3>${cart.title}</h3>

    <!-- JS will dynamically populate cart items -->
    <div class="cart-items"></div>

    <div class="cart-total">
        <strong>Total: ₹0</strong>
    </div>

    <button class="checkout-btn" onclick="window.location.href='${cart.checkoutPage @ context='uri'}.html?wcmmode=disabled'">
        Proceed to Checkout
    </button>
</div>

<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-call="${clientlib.css @ categories='practice.cart'}" />
<sly data-sly-call="${clientlib.js @ categories='practice.cart'}" />
